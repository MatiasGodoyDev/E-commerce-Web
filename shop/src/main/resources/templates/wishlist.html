<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Metallic</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <link rel="stylesheet" th:href="@{/css/wishlist.css}">
</head>

<body>

  <header class="navbar-metallic">
    <div class="nav-container">

      <nav class="nav-section nav-left">
        <a th:href="@{/index}" class="nav-item">Inicio</a>
        <span class="divider"></span>
        <a th:href="@{/ofertas}" class="nav-item">Ofertas</a>
        <span class="divider"></span>
        <a th:href="@{/moda}" class="nav-item">Moda</a>
      </nav>

      <div class="logo-wrapper">
        <div class="logo-circle">
          <img th:src="@{/Imagenes/Logo.png}" alt="Logo de la tienda" class="logo-img">
        </div>
      </div>

      <nav class="nav-section nav-right">
        <a th:href="@{/unico}" class="nav-item">Único</a>
        <span class="divider"></span>
        <a th:href="@{/personalizado}" class="nav-item">Personalizado</a>
        <a href="#" id="user-icon" class="nav-item user-login-btn">
          <span class="user-avatar">👤</span>
        </a>
        <span class="divider"></span>

        <div class="header-actions">
          <a th:href="@{/wishlist}" class="wishlist-header-btn" title="Ver mis Favoritos">
            <i class="fa-solid fa-heart"></i>
            <span class="wishlist-badge" id="wishlist-count">0</span>
          </a>

          <div class="cart-icon-container">
            <a th:href="@{/carrito}" class="cart-header-btn" title="Ver Carrito">
              <i class="fa-solid fa-cart-shopping"></i>
              <span class="cart-badge" id="cart-count">0</span>
            </a>
          </div>
        </div>
      </nav>

    </div>
  </header>

  <main class="wishlist-main-layout">

    <section class="wishlist-left-content">
      <h1 class="wishlist-page-title">Mi Lista de Deseos ❤️</h1>

      <div class="wishlist-grid-products" id="wishlist-grid">
      </div>
    </section>

    <aside class="wishlist-right-sidebar">
      <div class="summary-card">
        <h2>Acciones Rápidas</h2>
        <p class="wishlist-summary-text" id="wishlist-summary">
          Cargando tu lista...
        </p>
        <button type="button" class="btn-checkout" onclick="window.location.href='index.html'">
          Seguir Mirando Ropa
        </button>
      </div>
    </aside>

  </main>

  <script th:src="@{/js/E-commerce.js}"></script>
  <script th:src="@{/js/wishlist.js}"></script>
</body>

</html>
